# From this directory:  cp .env.example .env  (optional: set API_TOKEN)  &&  docker compose up -d --build
services:
  subs-web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    image: subs-web
    container_name: subs-web
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "${BIND:-0.0.0.0}:${PORT:-8080}:8080"
    environment:
      API_TOKEN: ${API_TOKEN:-}
      # Same path as on the host, so Jellyfin path remapping works unchanged.
      MEDIA_ROOT: /mnt/storage01/media
      JELLYFIN_URL: ${JELLYFIN_URL:-}
      JELLYFIN_TOKEN: ${JELLYFIN_TOKEN:-}
      JELLYFIN_HOST_PREFIX: /mnt/storage01/media
      JELLYFIN_CONTAINER_PREFIX: ${JELLYFIN_CONTAINER_PREFIX:-/data}
    volumes:
      - /mnt/storage01/media:/mnt/storage01/media
      - ./data:/data
      - ${HOME}/.cache/huggingface:/cache
